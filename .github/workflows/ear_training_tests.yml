---
name: Ear Training Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run ear training tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ear_training
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ear_training/requirements*.txt

      # Required by pydub to encode and decode MP3 files
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # Report unused code without failing the job
      - name: Find unused code
        continue-on-error: true
        run: vulture app api.py cli.py vulture_whitelist.py

      - name: Run tests
        run: pytest -ra
